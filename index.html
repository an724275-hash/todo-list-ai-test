<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f5">
  <link rel="icon" href="data:,">
  <title>Задачи</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>Задачи</h1>
      <span id="task-count" class="count" aria-label="Количество задач">0</span>
    </header>

    <form id="task-form" class="task-form">
      <label class="visually-hidden" for="task-input">Новая задача</label>
      <input id="task-input" name="task" type="text" maxlength="160" placeholder="Новая задача" autocomplete="off" required>
      <button type="submit">Добавить</button>
    </form>
    <p id="status" class="status" role="alert" hidden></p>

    <ul id="task-list" class="task-list" aria-label="Список задач"></ul>
  </main>
</body>
</html>
